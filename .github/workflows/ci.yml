name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      KUMORI_VERSION: 0.0.0-ci.${{ github.run_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Obtain pinned osu! source
        shell: pwsh
        run: ./scripts/update-lazer.ps1

      - name: Restore solution
        shell: pwsh
        run: dotnet restore Kumori.sln -p:Version=$env:KUMORI_VERSION

      - name: Build solution
        shell: pwsh
        run: dotnet build Kumori.sln -c Release --no-restore -p:Version=$env:KUMORI_VERSION -p:CI=true

      - name: Run tests
        shell: pwsh
        run: dotnet test Kumori.sln -c Release --no-restore --no-build -p:Version=$env:KUMORI_VERSION

      - name: Verify formatting
        shell: pwsh
        run: dotnet format Kumori.sln --verify-no-changes --no-restore --exclude third_party/osu

      - name: Review vulnerable packages
        shell: pwsh
        run: |
          $audit = dotnet list Kumori.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $vulnerabilities = @($audit.projects | ForEach-Object {
            $project = $_.path
            $_.frameworks | ForEach-Object {
              @($_.topLevelPackages) + @($_.transitivePackages) | Where-Object { $_ } | ForEach-Object {
                $package = $_
                $_.vulnerabilities | ForEach-Object {
                  [pscustomobject]@{ Project = $project; Package = $package.id; Version = $package.resolvedVersion; Advisory = $_.advisoryurl }
                }
              }
            }
          } | Where-Object { $_ })
          if ($vulnerabilities.Count -gt 0) {
            $summary = $vulnerabilities | ForEach-Object {
              "$($_.Project): $($_.Package) $($_.Version) $($_.Advisory)"
            }
            throw "NuGet audit found vulnerable dependencies:`n$($summary -join "`n")"
          }
