name: Build Windows release
run-name: "feat: ship Kumori ${{ github.ref_name }} replay and customization overhaul"

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Kumori (Windows x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      KUMORI_SIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      KUMORI_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive release version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') { $Matches[1] } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "KUMORI_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build and test
        shell: cmd
        run: build-app.cmd

      - name: Verify formatting
        shell: pwsh
        run: dotnet format Kumori.sln --verify-no-changes

      - name: Review vulnerable packages
        shell: pwsh
        run: |
          $audit = dotnet list Kumori.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $vulnerabilities = @($audit.projects | ForEach-Object {
            $project = $_.path
            $_.frameworks | ForEach-Object {
              @($_.topLevelPackages) + @($_.transitivePackages) | Where-Object { $_ } | ForEach-Object {
                $package = $_
                $_.vulnerabilities | ForEach-Object {
                  [pscustomobject]@{ Project = $project; Package = $package.id; Version = $package.resolvedVersion; Advisory = $_.advisoryurl }
                }
              }
            }
          } | Where-Object { $_ })
          $exceptionExpires = [datetime]'2026-12-31T00:00:00Z'
          $unexpected = @($vulnerabilities | Where-Object {
            $normalizedProject = $_.Project.Replace('\', '/')
            $approvedProject = $normalizedProject.EndsWith('/replay_viewer/Kumori.ReplayViewer.csproj') -or
              $normalizedProject.EndsWith('/tests/Kumori.Core.Tests/Kumori.Core.Tests.csproj')
            $approvedException = $approvedProject -and
              $_.Package -eq 'AutoMapper' -and
              $_.Version -eq '13.0.1' -and
              $_.Advisory -eq 'https://github.com/advisories/GHSA-rvv3-g6hj-g44x' -and
              [datetime]::UtcNow -lt $exceptionExpires
            -not $approvedException
          })
          if ($unexpected.Count -gt 0) {
            throw "NuGet audit found $($unexpected.Count) unexpected vulnerable dependency entries."
          }

      - name: Publish Kumori and the replay viewer
        shell: cmd
        run: build-app.cmd publish

      - name: Verify single-file publish
        shell: pwsh
        run: |
          $files = Get-ChildItem 'dist/app' -File
          if ($files.Count -ne 1 -or $files.Name -ne 'Kumori.exe') {
            throw "Expected only dist/app/Kumori.exe, found: $($files.Name -join ', ')"
          }
          $version = (Get-Item 'dist/app/Kumori.exe').VersionInfo.ProductVersion
          if (-not $version.StartsWith($env:KUMORI_VERSION)) {
            throw "Expected version $env:KUMORI_VERSION, found $version"
          }

      - name: Probe replay viewer
        shell: pwsh
        run: |
          $probe = & 'artifacts/viewer-release/Kumori.ReplayViewer.exe' --probe | ConvertFrom-Json
          if ($probe.status -ne 'ok' -or $probe.contract_version -ne 1 -or $probe.automapper_compatible -ne $true) {
            throw "Replay viewer probe failed"
          }

      - name: Verify signatures
        if: env.KUMORI_SIGN_CERTIFICATE_BASE64 != '' && env.KUMORI_SIGN_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          foreach ($path in @('dist/app/Kumori.exe', 'artifacts/viewer-release/Kumori.ReplayViewer.exe')) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $path`: $($signature.StatusMessage)"
            }
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/app/Kumori.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Kumori.exe" | Set-Content 'dist/app/Kumori.exe.sha256' -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kumori.exe
          path: |
            dist/app/Kumori.exe
            dist/app/Kumori.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/app/Kumori.exe
            dist/app/Kumori.exe.sha256
