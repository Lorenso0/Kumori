name: Build Windows release
run-name: "feat: ship Kumori ${{ github.ref_name }} replay and customization overhaul"

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  validation-gate:
    name: Require validated main commit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve release commit
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          "RELEASE_COMMIT=$commit" >> $env:GITHUB_ENV

      - name: Wait for successful main validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:RELEASE_COMMIT origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $env:RELEASE_COMMIT is not reachable from main."
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$env:RELEASE_COMMIT&per_page=20"
          $deadline = [datetime]::UtcNow.AddMinutes(15)

          while ([datetime]::UtcNow -lt $deadline) {
            $response = Invoke-RestMethod -Headers $headers -Uri $uri
            $runs = @($response.workflow_runs | Where-Object { $_.head_sha -eq $env:RELEASE_COMMIT })
            $successful = $runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' } | Select-Object -First 1
            if ($successful) {
              Write-Host "Validated by $($successful.html_url)"
              exit 0
            }

            $active = @($runs | Where-Object { $_.status -ne 'completed' })
            if ($active.Count -eq 0 -and $runs.Count -gt 0) {
              $failed = $runs | Select-Object -First 1
              throw "Main validation did not succeed: $($failed.conclusion) $($failed.html_url)"
            }

            Write-Host "Waiting for Validate to pass for $env:RELEASE_COMMIT..."
            Start-Sleep -Seconds 15
          }

          throw "Timed out waiting for main validation of $env:RELEASE_COMMIT."

  build-release:
    name: Build Kumori (Windows x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive release version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') { $Matches[1] } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "KUMORI_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish Kumori and the replay viewer
        shell: cmd
        run: build-app.cmd publish

      - name: Review vulnerable packages
        shell: pwsh
        run: |
          $auditJson = dotnet list Kumori.sln package --vulnerable --include-transitive --format json --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet audit command failed with exit code $LASTEXITCODE."
          }
          $audit = $auditJson | ConvertFrom-Json
          $vulnerabilities = @($audit.projects | ForEach-Object {
            $project = $_.path
            $_.frameworks | ForEach-Object {
              @($_.topLevelPackages) + @($_.transitivePackages) | Where-Object { $_ } | ForEach-Object {
                $package = $_
                $_.vulnerabilities | ForEach-Object {
                  [pscustomobject]@{ Project = $project; Package = $package.id; Version = $package.resolvedVersion; Advisory = $_.advisoryurl }
                }
              }
            }
          } | Where-Object { $_ })
          if ($vulnerabilities.Count -gt 0) {
            $summary = $vulnerabilities | ForEach-Object {
              "$($_.Project): $($_.Package) $($_.Version) $($_.Advisory)"
            }
            throw "NuGet audit found vulnerable dependencies:`n$($summary -join "`n")"
          }

      - name: Verify single-file publish
        shell: pwsh
        run: |
          $files = Get-ChildItem 'dist/app' -File
          if ($files.Count -ne 1 -or $files.Name -ne 'Kumori.exe') {
            throw "Expected only dist/app/Kumori.exe, found: $($files.Name -join ', ')"
          }
          $version = (Get-Item 'dist/app/Kumori.exe').VersionInfo.ProductVersion
          if (-not $version.StartsWith($env:KUMORI_VERSION)) {
            throw "Expected version $env:KUMORI_VERSION, found $version"
          }

      - name: Probe replay viewer
        shell: pwsh
        run: |
          $probe = & 'artifacts/viewer-release/Kumori.ReplayViewer.exe' --probe | ConvertFrom-Json
          if ($probe.status -ne 'ok' -or $probe.contract_version -ne 1 -or $probe.automapper_compatible -ne $true) {
            throw "Replay viewer probe failed"
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/app/Kumori.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Kumori.exe" | Set-Content 'dist/app/Kumori.exe.sha256' -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kumori.exe
          path: |
            dist/app/Kumori.exe
            dist/app/Kumori.exe.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - validation-gate
      - build-release
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Kumori.exe
          path: dist/app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/app/Kumori.exe
            dist/app/Kumori.exe.sha256
