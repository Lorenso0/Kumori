name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Kumori (Windows x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Kumori and the replay viewer
        shell: cmd
        run: build-app.cmd publish

      - name: Verify single-file publish
        shell: pwsh
        run: |
          $files = Get-ChildItem 'dist/app' -File
          if ($files.Count -ne 1 -or $files.Name -ne 'Kumori.exe') {
            throw "Expected only dist/app/Kumori.exe, found: $($files.Name -join ', ')"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumori.exe
          path: dist/app/Kumori.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/app/Kumori.exe
