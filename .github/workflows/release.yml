name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Kumori (Windows x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Obtain the osu!lazer source dependency
        shell: pwsh
        run: ./scripts/update-lazer.ps1

      - name: Publish Kumori and the replay viewer
        shell: cmd
        run: build-app.cmd publish

      - name: Package release
        shell: pwsh
        run: |
          $archive = 'Kumori-win-x64.zip'
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path 'dist/app/*' -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumori-win-x64
          path: Kumori-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Kumori-win-x64.zip
